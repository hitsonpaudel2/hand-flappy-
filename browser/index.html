<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hand Flappy PRO</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="game-container">

        <h1>HAND FLAPPY PRO</h1>


        <!-- Game -->

        <canvas
            id="gameCanvas"
        ></canvas>


        <!-- Webcam -->

        <div class="camera-container">

    <video
        id="webcam"
        autoplay
        playsinline
        muted
    ></video>

    <canvas
        id="handCanvas"
    ></canvas>

    <div class="camera-label">
        HAND TRACKING
    </div>

</div>


        <button
            id="startButton"
        >
            START GAME
        </button>


        <p>
            Flip your hand to fly ✋
        </p>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="game.js"></script>

</body>

</html>
